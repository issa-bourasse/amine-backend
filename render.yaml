services:
  - type: web
    name: students-backend
    env: node
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: PORT
        value: 3001
      - key: CLIENT_ORIGIN
        # Replace with your Netlify frontend URL after deployment
        value: https://your-frontend.netlify.app
